<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Board</title>
<meta name="description" content="A simple dot-grid task board — nodes and connectors, saved in your browser.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/DDT-Light.svg">
<link rel="icon" href="assets/DDT-Dark.svg" media="(prefers-color-scheme: dark)">
<script>
  /* Apply the saved theme before first paint so there is no flash. */
  try {
    var t = localStorage.getItem('taskboard.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/styles.css?v=3">
</head>
<body>

<div class="app">

  <header class="topbar">
    <svg class="applogo" viewBox="12 16 221 224" role="img" aria-label="Digital Department">
      <path fill="var(--logo-track)" d="M42,98h60c16.57,0,30,13.43,30,30h0c0,16.57-13.43,30-30,30h-60c-16.57,0-30-13.43-30-30h0c0-16.57,13.43-30,30-30Z"/>
      <path fill="var(--logo-fg)" d="M125.67,16H31c-4.42,0-8,3.58-8,8v58.67c0,4.42,3.58,8,8,8h40c4.42,0,8-3.58,8-8v-2.67c0-4.42,3.58-8,8-8h20c51.33,0,70,24.5,70,56s-18.67,56-70,56h-20c-4.42,0-8-3.58-8-8v-2.67c0-4.42-3.58-8-8-8H31c-4.42,0-8,3.58-8,8v58.67c0,4.42,3.58,8,8,8h94.67c72.33,0,107.33-44.33,107.33-112S198,16,125.67,16Z"/>
      <circle cx="102" cy="128" r="22" fill="#FF453A"/>
    </svg>
    <span class="brand">Task Board</span>
    <span class="muted-13" id="boardCount"></span>
    <span class="spacer"></span>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch theme" title="Switch theme"></button>
  </header>

  <div class="body">

    <aside class="sidebar">
      <form class="new-board" id="newBoardForm" autocomplete="off">
        <label class="field">
          <input id="draft" type="text" placeholder="Product name" aria-label="Product name">
        </label>
        <button type="submit" class="btn btn-secondary">Add</button>
      </form>
      <div class="board-list" id="boardList"></div>
    </aside>

    <main class="main">

      <section class="board-view" id="boardView" hidden>
        <div class="toolbar">
          <span class="board-name" id="activeName"></span>
          <span class="spacer"></span>
          <button class="btn" id="addNode" type="button">
            <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            <span>Node</span>
          </button>
          <button class="btn" id="linkNodes" type="button" aria-pressed="false">
            <svg class="i" viewBox="0 0 24 24"><path d="M15 7h3a5 5 0 0 1 0 10h-3m-6 0H6a5 5 0 0 1 0-10h3M8 12h8"/></svg>
            <span>Link nodes</span>
          </button>
          <span class="muted-12" id="hint"></span>
        </div>

        <div class="canvas" id="canvas">
          <svg class="links" id="linksSvg" width="100%" height="100%" aria-hidden="true">
            <defs>
              <marker id="tb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--geist-accents-3)"></path>
              </marker>
              <marker id="tb-arrow-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--geist-success)"></path>
              </marker>
            </defs>
            <g id="linksG"></g>
          </svg>
        </div>
      </section>

      <section class="empty" id="emptyState" hidden>
        <p class="empty-title">No board selected</p>
        <p class="empty-sub">Add a product name on the left to open a blank grid.</p>
      </section>

    </main>
  </div>
</div>

<div class="menu" id="boardMenu" role="menu" hidden>
  <button class="menu-item danger" id="menuDelete" type="button" role="menuitem">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
    <span>Delete board</span>
  </button>
</div>

<script src="assets/app.js?v=3"></script>
</body>
</html>
